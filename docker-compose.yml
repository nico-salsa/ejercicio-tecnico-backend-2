services:
  postgres:
    image: postgres:17
    container_name: banking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-bootstrap:
    image: postgres:17
    container_name: banking-db-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./BaseDatos.sql:/scripts/BaseDatos.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - psql -h postgres -U postgres -d postgres -f /scripts/BaseDatos.sql
    restart: "no"

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      CUSTOMER_SERVICE_PORT: 8081
      CUSTOMER_SERVICE_DB_URL: jdbc:postgresql://postgres:5432/customer_service
      CUSTOMER_SERVICE_DB_USERNAME: postgres
      CUSTOMER_SERVICE_DB_PASSWORD: postgres
    ports:
      - "8081:8081"

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      ACCOUNT_SERVICE_PORT: 8082
      ACCOUNT_SERVICE_DB_URL: jdbc:postgresql://postgres:5432/account_service
      ACCOUNT_SERVICE_DB_USERNAME: postgres
      ACCOUNT_SERVICE_DB_PASSWORD: postgres
    ports:
      - "8082:8082"

volumes:
  postgres-data:
