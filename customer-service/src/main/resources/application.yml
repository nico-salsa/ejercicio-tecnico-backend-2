server:
  port: ${CUSTOMER_SERVICE_PORT:8081}

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${CUSTOMER_SERVICE_DB_USERNAME:postgres}
    password: ${CUSTOMER_SERVICE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
