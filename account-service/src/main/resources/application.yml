server:
  port: ${ACCOUNT_SERVICE_PORT:8082}

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/account_service}
    username: ${ACCOUNT_SERVICE_DB_USERNAME:postgres}
    password: ${ACCOUNT_SERVICE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
