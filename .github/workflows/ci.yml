name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            ".gitignore"
            "openspec/config.yaml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Validate repository guidance
        shell: bash
        run: |
          set -euo pipefail
          grep -q "git flow" README.md
          grep -q "develop" README.md
          grep -q "feature/" README.md
          grep -q "push" README.md

  java-validation:
    name: java-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Java modules
        id: java-detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          modules=()
          for wrapper in **/mvnw **/gradlew; do
            if [[ -f "$wrapper" ]]; then
              modules+=("$(dirname "$wrapper")")
            fi
          done

          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "No Java modules with Maven or Gradle wrapper were found. Skipping build and tests."
            exit 0
          fi

          unique_modules=$(printf '%s\n' "${modules[@]}" | sort -u | paste -sd "," -)
          echo "has_modules=true" >> "$GITHUB_OUTPUT"
          echo "modules=$unique_modules" >> "$GITHUB_OUTPUT"

      - name: Build and test Java modules
        if: steps.java-detect.outputs.has_modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a modules <<< "${{ steps.java-detect.outputs.modules }}"

          for module in "${modules[@]}"; do
            echo "Running Java validation in $module"
            if [[ -f "$module/mvnw" ]]; then
              chmod +x "$module/mvnw"
              (cd "$module" && ./mvnw -B verify)
            elif [[ -f "$module/gradlew" ]]; then
              chmod +x "$module/gradlew"
              (cd "$module" && ./gradlew test)
            else
              echo "Unsupported Java module without wrapper: $module" >&2
              exit 1
            fi
          done

  container-validation:
    name: container-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect container artifacts
        id: container-detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          dockerfiles=()
          for file in **/Dockerfile **/*.Dockerfile; do
            if [[ -f "$file" ]]; then
              dockerfiles+=("$file")
            fi
          done

          compose_files=()
          for file in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [[ -f "$file" ]]; then
              compose_files+=("$file")
            fi
          done

          if [[ ${#dockerfiles[@]} -eq 0 && ${#compose_files[@]} -eq 0 ]]; then
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No container artifacts were found. Skipping container validation."
            exit 0
          fi

          dockerfiles_csv=$(printf '%s\n' "${dockerfiles[@]}" | paste -sd "," -)
          compose_csv=$(printf '%s\n' "${compose_files[@]}" | paste -sd "," -)

          echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          echo "dockerfiles=$dockerfiles_csv" >> "$GITHUB_OUTPUT"
          echo "compose_files=$compose_csv" >> "$GITHUB_OUTPUT"

      - name: Validate Dockerfiles
        if: steps.container-detect.outputs.has_artifacts == 'true' && steps.container-detect.outputs.dockerfiles != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a dockerfiles <<< "${{ steps.container-detect.outputs.dockerfiles }}"

          for dockerfile in "${dockerfiles[@]}"; do
            [[ -z "$dockerfile" ]] && continue
            context_dir=$(dirname "$dockerfile")
            tag_name=$(echo "$dockerfile" | tr '/.' '-')
            echo "Validating Dockerfile $dockerfile with context $context_dir"
            docker build --file "$dockerfile" --tag "ci-$tag_name" "$context_dir"
          done

      - name: Validate compose files
        if: steps.container-detect.outputs.has_artifacts == 'true' && steps.container-detect.outputs.compose_files != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a compose_files <<< "${{ steps.container-detect.outputs.compose_files }}"

          for compose_file in "${compose_files[@]}"; do
            [[ -z "$compose_file" ]] && continue
            echo "Validating compose file $compose_file"
            docker compose -f "$compose_file" config
          done
